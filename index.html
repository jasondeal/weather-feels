<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Feels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Top: location name pill -->
    <header id="top-bar">
      <span id="location-name"></span>
    </header>

    <!-- Middle: grows to fill space, centers active state -->
    <main id="center-area">

      <!-- Initial state: no zip saved -->
      <div id="welcome">
        <p>Enter your zip code to see how today's weather compares to yesterday's.</p>
      </div>

      <!-- Loading state -->
      <div id="loading" hidden>
        <div class="spinner"></div>
        <p>Loading weather&hellip;</p>
      </div>

      <!-- Weather result -->
      <div id="weather-display" hidden>
        <p id="day-header"></p>
        <p id="weather-message"></p>
        <p id="rain-message"></p>
        <div id="temp-detail">
          <div class="temp-item">
            <span class="temp-label" id="temp-n1-label"></span>
            <span class="temp-value" id="temp-n1-value"></span>
          </div>
          <div class="temp-divider"></div>
          <div class="temp-item">
            <span class="temp-label" id="temp-n-label"></span>
            <span class="temp-value" id="temp-n-value"></span>
          </div>
        </div>
      </div>

      <!-- Error state -->
      <div id="error-display" hidden></div>

    </main>

    <!-- Bottom: zip code form, always visible -->
    <footer id="bottom-bar">
      <form id="zip-form">
        <input
          type="text"
          id="zip-input"
          placeholder="Enter zip code"
          maxlength="10"
          inputmode="numeric"
          autocomplete="postal-code"
          aria-label="Zip code"
        >
        <button type="submit">Go</button>
      </form>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
