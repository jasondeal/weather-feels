  <line x1="52"  y1="218" x2="65"  y2="248" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="232" x2="125" y2="262" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="218" x2="185" y2="248" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="232" y1="236" x2="245" y2="266" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="222" x2="305" y2="252" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="355" y1="238" x2="368" y2="268" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="415" y1="220" x2="428" y2="250" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="475" y1="236" x2="488" y2="266" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="535" y1="222" x2="548" y2="252" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="598" y1="238" x2="611" y2="268" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="658" y1="218" x2="671" y2="248" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="718" y1="232" x2="731" y2="262" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>

  <!-- Row 2 (offset, lower) -->
  <line x1="82"  y1="340" x2="95"  y2="370" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="158" y1="328" x2="171" y2="358" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="352" x2="255" y2="382" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="332" y1="336" x2="345" y2="366" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="422" y1="348" x2="435" y2="378" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="512" y1="335" x2="525" y2="365" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="598" y1="352" x2="611" y2="382" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="682" y1="338" x2="695" y2="368" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>
  <line x1="754" y1="348" x2="767" y2="378" stroke="#89CFF0" stroke-width="3" stroke-linecap="round"/>

  <!-- Puddles at the bottom -->
  <ellipse cx="148"  cy="572" rx="66"  ry="13" fill="#89CFF0" opacity="0.65"/>
  <ellipse cx="398"  cy="581" rx="88"  ry="15" fill="#89CFF0" opacity="0.65"/>
  <ellipse cx="638"  cy="574" rx="74"  ry="13" fill="#89CFF0" opacity="0.65"/>

