<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">

  <!-- Sky -->
  <rect width="800" height="600" fill="#5C6B7A"/>

  <!-- Storm cloud 1 (left-center, large) -->
  <circle cx="198" cy="138" r="60"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>
  <circle cx="258" cy="105" r="74"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>
  <circle cx="332" cy="126" r="65"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>
  <circle cx="385" cy="148" r="50"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>

  <!-- Storm cloud 2 (right) -->
  <circle cx="492" cy="132" r="52"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>
  <circle cx="548" cy="100" r="68"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>
  <circle cx="614" cy="122" r="58"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>
  <circle cx="658" cy="142" r="42"  fill="#3D4F5C" stroke="#2E3D48" stroke-width="3"/>

  <!-- Rain drops — two staggered rows of diagonal streaks -->
